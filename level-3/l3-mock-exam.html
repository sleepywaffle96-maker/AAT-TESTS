<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAT Level 3 FAPR - Official Style Mock Exam</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* ========================================== */
        /* DESIGN SYSTEM & CORE INTERFACCIA ASSESSMENT */
        /* ========================================== */
        :root {
            --bg-dark-external: #0B0F19;
            --bubble-white-bg: #FFFFFF;
            --l2-emerald-primary: #059669;
            --l2-emerald-dark: #047857;
            --l2-emerald-light: #E6F4EA;
            --text-dark: #1F2937;
            --text-muted: #4B5563;
            --border-color: #E5E7EB;
            --danger-color: #DC2626;
            --success-box-bg: #DEF7EC;
            --neon-calc-accent: #00FF66;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark-external);
            color: var(--text-dark);
            margin: 0;
            padding-top: 80px;
        }
        /* CORREZIONE CROMATICA LIVELLO 3 - FORZATURA AZZURRO EDITORIALE SEZIONI */
        .exam-top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: #111827;
            border-bottom: 2px solid #0284C7; /* Cambiato in Azzurro Livello 3 */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            box-sizing: border-box;
            z-index: 1000;
        }

        .top-bar-title {
            color: #FFFFFF;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }
        .timer-container {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .timer-countdown {
            font-family: 'JetBrains Mono', monospace;
            color: #FFFFFF;
            font-weight: 700;
            background: #1F2937;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            font-size: 1.1rem;
            border: 1px solid #374151;
        }
        .exam-main-wrapper {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .white-bubble-container {
            background-color: var(--bubble-white-bg);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
        }
        .exam-tabs-navigation {
            display: flex;
            gap: 0.35rem;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 1px;
        }
        .tab-trigger-btn {
            background: #F3F4F6;
            border: 1px solid var(--border-color);
            border-bottom: none;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            white-space: nowrap;
            transition: all 0.15s ease;
        }
        .tab-trigger-btn:hover { background: #E5E7EB; }
        .tab-trigger-btn.active {
            background: var(--bubble-white-bg);
            color: #0284C7 !important; /* Testo attivo Azzurro */
            border-top: 3px solid #0284C7 !important; /* Linea superiore attiva Azzurro */
            padding-bottom: calc(0.6rem + 2px);
            margin-bottom: -2px;
        }
        .exam-task-panel { display: none; }
        .exam-task-panel.active { display: block; }
        .task-interactive-body {
            background-color: #FAFAFA;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1.5rem 0;
        }
        .financial-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: #FFFFFF;
        }
        .financial-table th {
            background-color: var(--l2-emerald-dark);
            color: #FFFFFF;
            padding: 0.6rem;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--l2-emerald-dark);
        }
        .financial-table td {
            border: 1px solid var(--border-color);
            padding: 0.6rem;
            font-size: 0.9rem;
        }
        .table-input {
            width: 100%;
            padding: 0.4rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        .text-right { text-align: right; }
        .text-left { text-align: left; }
        .option-label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 0.5rem;
        }
        .exam-footer-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--border-color);
        }
        .ctrl-btn {
            padding: 0.65rem 1.25rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
        }
        .btn-secondary { background: #E5E7EB; color: var(--text-dark); }
        .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-danger { background: var(--danger-color); color: #FFFFFF; }
        .btn-success { background: var(--l2-emerald-primary); color: #FFFFFF; }
        .tool-btn { background: #374151; color: #FFF; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
        .exam-results-card {
            margin-top: 2rem;
            background: #F9FAFB;
            border: 2px solid var(--l2-emerald-primary);
            border-radius: 8px;
            padding: 1.5rem;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }
        .result-metric {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            padding: 1.2rem;
            border-radius: 6px;
            text-align: center;
        }
        .metric-label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem; }
        .metric-value { font-size: 1.4rem; font-weight: 700; color: var(--l2-emerald-dark); }
        .drag-calculator-panel {
            position: fixed;
            top: 85px;
            right: 30px;
            width: 240px;
            background: #111827;
            border: 2px solid var(--neon-calc-accent);
            border-radius: 8px;
            display: none;
            z-index: 2000;
        }
        .calc-header {
            background: #1F2937;
            padding: 0.5rem;
            color: var(--neon-calc-accent);
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #374151;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
        }
        .calc-display-input {
            width: 100%;
            background: #000000;
            color: var(--neon-calc-accent);
            border: 1px solid #374151;
            text-align: right;
            padding: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .calc-grid-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; margin-top: 0.5rem; }
        .calc-btn { background: #374151; color: #FFFFFF; border: none; padding: 0.55rem; cursor: pointer; font-weight: 700; border-radius: 4px; }
        .btn-equal { background: var(--neon-calc-accent); color: #000000; grid-row: span 2; display: flex; align-items: center; justify-content: center; }
        .feedback-box { margin-top: 1.2rem; padding: 1.2rem; border-radius: 6px; border-left: 4px solid; }
        .hidden { display: none !important; }

        @media print {
            body { background: #FFFFFF !important; padding-top: 0 !important; color: #000000 !important; }
            .exam-top-bar, .exam-tabs-navigation, .exam-footer-controls, .drag-calculator-panel { display: none !important; }
            .exam-main-wrapper { margin: 0 !important; padding: 0 !important; max-width: 100% !important; }
            .white-bubble-container { border: none !important; box-shadow: none !important; padding: 0 !important; }
            .exam-task-panel { display: block !important; page-break-after: always; }
            .task-interactive-body { background: #FFFFFF !important; border: 1px solid #000000 !important; }
            .exam-results-card { display: block !important; border: 2px solid #000000 !important; background: #FFFFFF !important; page-break-before: always; }
            input { border: none !important; border-bottom: 1px solid #000000 !important; background: transparent !important; }
        }
    </style>
</head>
<body>
    <!-- BARRA FISSA SUPERIORE -->
    <div class="exam-top-bar">
        <div class="top-bar-title">🏆 AAT LEVEL 3: FAPR LIVE ASSESSMENT</div>
        <div class="timer-container">
            <button type="button" class="tool-btn" onclick="toggleCalc()">🧮 Calculator</button>
            <div id="exam-timer" class="timer-countdown">60:00</div>
        </div>
    </div>

    <!-- BOLLA BIANCA CENTRALE -->
    <main class="exam-main-wrapper">
        <div class="white-bubble-container">
            <!-- SCHEDE TASK -->
            <div class="exam-tabs-navigation" id="exam-tabs-headers"></div>
            
            <!-- CONTENITORE DOMANDE -->
            <form id="mock-exam-form" onsubmit="event.preventDefault();">
                <div id="exam-panels-container"></div>
            </form>
            
            <!-- PULSANTI DI CONTROLLO -->
            <div class="exam-footer-controls">
                <div>
                    <button type="button" class="ctrl-btn btn-secondary" id="btn-prev" onclick="navPrev()">⬅️ Previous</button>
                    <button type="button" class="ctrl-btn btn-secondary" id="btn-next" onclick="navNext()">Next ➡️</button>
                </div>
                <div>
                    <button type="button" class="ctrl-btn btn-danger" onclick="resetExam()">Reset</button>
                    <button type="button" class="ctrl-btn btn-success" onclick="submitExam()">Submit</button>
                </div>
            </div>

            <!-- TABELLA RISULTATI (NASCROSTA DI DEFAULT) -->
            <div class="exam-results-card hidden" id="results-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; border-bottom:2px solid #E5E7EB; padding-bottom:0.5rem;">
                    <h2 style="color:#111827; margin:0; font-size:1.3rem;">Official Performance Report</h2>
                    <button type="button" class="ctrl-btn btn-secondary" onclick="window.print()">Download as PDF (A4 Print)</button>
                </div>
                <div class="results-grid">
                    <div class="result-metric">
                        <span class="metric-label">Final Grade</span>
                        <span class="metric-value" id="res-score">0%</span>
                    </div>
                    <div class="result-metric">
                        <span class="metric-label">Points Awarded</span>
                        <span class="metric-value" id="res-points">0 / 100</span>
                    </div>
                    <div class="result-metric">
                        <span class="metric-label">Outcome</span>
                        <span class="metric-value" id="res-outcome">-</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- WIDGET CALCOLATRICE NEON POP-UP -->
    <div class="drag-calculator-panel" id="neon-calc">
        <div class="calc-header" id="calc-header">AAT SYSTEM CALCULATOR <span onclick="toggleCalc()" style="cursor:pointer; font-size:1.2rem;">✕</span></div> 
        <div style="padding:0.6rem;">
            <input type="text" id="calc-display" class="calc-display-input" readonly value="0">
            <div class="calc-grid-buttons">
                <button type="button" class="calc-btn" style="color:#F87171;" onclick="clearCalc()">C</button>
                <button type="button" class="calc-btn" style="color:#00FF66;" onclick="pressOp('/')">/</button>
                <button type="button" class="calc-btn" style="color:#00FF66;" onclick="pressOp('*')">*</button>
                <button type="button" class="calc-btn" style="color:#00FF66;" onclick="pressOp('-')">-</button>
                <button type="button" class="calc-btn" onclick="pressNum('7')">7</button>
                <button type="button" class="calc-btn" onclick="pressNum('8')">8</button>
                <button type="button" class="calc-btn" onclick="pressNum('9')">9</button>
                <button type="button" class="calc-btn style-plus" style="color:#00FF66;" onclick="pressOp('+')">+</button>
                <button type="button" class="calc-btn" onclick="pressNum('4')">4</button>
                <button type="button" class="calc-btn" onclick="pressNum('5')">5</button>
                <button type="button" class="calc-btn" onclick="pressNum('6')">6</button>
                <button type="button" class="calc-btn btn-equal" onclick="calcResult()">=</button>
                <button type="button" class="calc-btn" onclick="pressNum('1')">1</button>
                <button type="button" class="calc-btn" onclick="pressNum('2')">2</button>
                <button type="button" class="calc-btn" onclick="pressNum('3')">3</button>
                <button type="button" class="calc-btn" style="grid-column: span 2;" onclick="pressNum('0')">0</button>
                <button type="button" class="calc-btn" onclick="pressNum('.')">.</button>
            </div>
        </div>
    </div>
<script>
const questionsDatabase = [
    {
        id: 1,
        chapter: 1,
        type: "input",
        points: 10,
        instruction: "An employee uses confidential accounting files to buy shares before a corporate public announcement. Under the AAT Code of Professional Ethics, state which specific fundamental principle has been directly breached.",
        content: `
            <table class="financial-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">Ethical Compliance Investigation Field</th>
                        <th style="width: 300px;">User Statement Input</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;">Name of the breached principle (e.g. Integrity, Objectivity, etc.)</td>
                        <td><input type="text" class="multi-input-field" data-ans="Integrity" placeholder="Type answer..."></td>
                    </tr>
                </tbody>
            </table>
        `,
        solution: "Trading on insider accounting details demonstrates dishonesty and lack of fair dealing, violating the foundational principle of Integrity."
    },
    {
        id: 2,
        chapter: 1,
        type: "select",
        points: 10,
        instruction: "Complete the regulatory compliance statement regarding international anti-money laundering reporting lines.",
        content: `
            <div style="line-height: 2; font-size: 1.05rem;">
                If a bookkeeper identifies suspicious ledger entries that indicate potential money laundering, they must immediately report this event internally to the company's designated 
                <select class="multi-select-field" data-ans="mlro">
                    <option value="">-- Select Officer --</option>
                    <option value="ceo">Chief Executive Officer (CEO)</option>
                    <option value="mlro">Money Laundering Reporting Officer (MLRO)</option>
                </select> 
                rather than warning the client, which would represent the illegal act of 
                <select class="multi-select-field" data-ans="tipping">
                    <option value="">-- Select Offence --</option>
                    <option value="tipping">Tipping-off</option>
                    <option value="fraud">Fraudulent trading</option>
                </select>.
            </div>
        `,
        solution: "Suspicious transactions must be escalated internally via the MLRO. Warning the customer directly leaks the audit check, triggering a 'tipping-off' criminal offence."
    },
    {
        id: 3,
        chapter: 2,
        type: "input",
        points: 15,
        instruction: "A company purchases equipment for £20,000. It applies a reducing balance depreciation framework rate of 20% per annum. Compute the depreciation charge for the second year.",
        content: `
            <table class="financial-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">FAPS Year-End Adjustment Extraction</th>
                        <th style="width: 250px;">Calculated Ledger Value (£)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;">Year 2 Depreciation Expense Charge (Integer value)</td>
                        <td><input type="text" class="multi-input-field numeric-field" data-ans="3200" placeholder="0"></td>
                    </tr>
                </tbody>
            </table>
        `,
        solution: "Year 1 Charge = £20,000 × 20% = £4,000. Net Book Value end of Year 1 = £20,000 - £4,000 = £16,000. Year 2 Charge = £16,000 × 20% = £3,200."
    },
    {
        id: 4,
        chapter: 2,
        type: "input",
        points: 15,
        instruction: "On 31 December, the rent expense account holds a debit total of £6,000. This includes a £1,500 advance invoice payment covering January of the subsequent year. Calculate the adjusted rent expense figure for the current Profit or Loss account.",
        content: `
            <table class="financial-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">FAPS Accruals & Prepayments Adjustment</th>
                        <th style="width: 250px;">Carrying Value (£)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;">Adjusted Current Year Rent Expense (Integer value)</td>
                        <td><input type="text" class="multi-input-field numeric-field" data-ans="4500" placeholder="0"></td>
                    </tr>
                </tbody>
            </table>
        `,
        solution: "The advance payment is a prepayment and must be deducted from current totals: £6,000 ledger balance - £1,500 prepaid portion = £4,500 adjusted expense."
    },
    {
        id: 5,
        chapter: 2,
        type: "select",
        points: 10,
        instruction: "Select the correct accounting entries required to write off an irrecoverable debt from a customer ledger.",
        content: `
            <div style="line-height: 2; font-size: 1.05rem;">
                To permanently eliminate an uncollectible balance from the accounts, the accountant must 
                <select class="multi-select-field" data-ans="debit">
                    <option value="">-- Side A --</option>
                    <option value="debit">Debit Irrecoverable Debts Expense Account</option>
                    <option value="credit">Credit Irrecoverable Debts Expense Account</option>
                </select> 
                and subsequently 
                <select class="multi-select-field" data-ans="credit">
                    <option value="">-- Side B --</option>
                    <option value="debit">Debit Sales Ledger Control Account (SLCA)</option>
                    <option value="credit">Credit Sales Ledger Control Account (SLCA)</option>
                </select>.
            </div>
        `,
        solution: "Writing off bad debts requires an expense entry (Debit Irrecoverable Debts) and a corresponding reduction in the outstanding customer asset ledger rows (Credit SLCA)."
    },
    {
        id: 6,
        chapter: 2,
        type: "input",
        points: 15,
        instruction: "A partnership shares profits in a 3:2 ratio between Partner A and Partner B. The total residual profit available for appropriation is £50,000. Calculate Partner A's shared allocation.",
        content: `
            <table class="financial-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">Partnership Appropriation Matrix Allocation</th>
                        <th style="width: 250px;">Profit Portion (£)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;">Partner A Shared Profit Allocation (Integer value)</td>
                        <td><input type="text" class="multi-input-field numeric-field" data-ans="30000" placeholder="0"></td>
                    </tr>
                </tbody>
            </table>
        `,
        solution: "Total ratio parts = 3 + 2 = 5 parts. Partner A allocation = £50,000 × (3 / 5) = £30,000 residual profit portion."
    },
    {
        id: 7,
        chapter: 3,
        type: "input",
        points: 15,
        instruction: "A production unit establishes a standard material usage of 2 kg per unit at a standard cost of £5 per kg. During the month, it manufactures 1,000 units utilizing exactly 2,100 kg of material. Calculate the Material Usage Variance value.",
        content: `
            <table class="financial-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">MATS Variance Cost Evaluation Framework</th>
                        <th style="width: 250px;">Variance Amount (£)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;">Material Usage Variance Value (Integer value only)</td>
                        <td><input type="text" class="multi-input-field numeric-field" data-ans="500" placeholder="0"></td>
                    </tr>
                </tbody>
            </table>
        `,
        solution: "Standard Usage for actual output = 1,000 units × 2 kg = 2,000 kg. Actual Usage = 2,100 kg. Excess usage = 100 kg (Adverse). Variance value = 100 kg × £5 standard price = £500 Adverse."
    },
    {
        id: 8,
        chapter: 3,
        type: "select",
        points: 10,
        instruction: "Complete the cost behaviour analysis mapping for short-term management decision processes.",
        content: `
            <div style="line-height: 2; font-size: 1.05rem;">
                When evaluating manufacturing output flexes, direct materials and factory line assembly labor are tracked as 
                <select class="multi-select-field" data-ans="variable">
                    <option value="">-- Cost Behavior A --</option>
                    <option value="fixed">Fixed cost elements</option>
                    <option value="variable">Variable cost elements</option>
                </select> 
                while supervisor salaries and commercial factory space leasing represent rigid 
                <select class="multi-select-field" data-ans="fixed">
                    <option value="">-- Cost Behavior B --</option>
                    <option value="fixed">Fixed overhead metrics</option>
                    <option value="variable">Variable overhead metrics</option>
                </select>.
            </div>
        `,
        solution: "Direct production materials scale directly in proportion to volume (Variable), whereas factory leasing remains a constant capacity charge over the operating window (Fixed)."
    },
    {
        id: 9,
        chapter: 3,
        type: "input",
        points: 15,
        instruction: "An enterprise forecasts a closing cash balance deficit of £2,000 for April. May operations project total physical cash receipts of £15,000 and total physical bank cash payments of £11,000. Compute the forecasted net cash balance at the end of May.",
        content: `
            <table class="financial-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">MATS Cash Budgeting Control Component</th>
                        <th style="width: 250px;">Forecasted Balance (£)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;">May Net Closing Bank Balance (Integer value)</td>
                        <td><input type="text" class="multi-input-field numeric-field" data-ans="2000" placeholder="0"></td>
                    </tr>
                </tbody>
            </table>
        `,
        solution: "May Net Cash Flow = Receipts £15,000 - Payments £11,000 = +£4,000 surplus. May Closing Balance = April Opening Deficit (-£2,000) + May Surplus (+£4,000) = +£2,000 cash balance."
    },
    {
        id: 10,
        chapter: 4,
        type: "input",
        points: 15,
        instruction: "A business under the standard UK VAT scheme compiles its quarter-end records. It logs total output VAT collected on sales of £8,500 and total input VAT paid on business expenses of £6,200. Calculate the net tax payment due to HMRC.",
        content: `
            <table class="financial-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">TPFB Statutory VAT Return Sheet</th>
                        <th style="width: 250px;">Net Tax Due (£)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;">Box 5 Net Payment Allocation (Integer value)</td>
                        <td><input type="text" class="multi-input-field numeric-field" data-ans="2300" placeholder="0"></td>
                    </tr>
                </tbody>
            </table>
        `,
        solution: "Net VAT Payable to HMRC = Output VAT - Input VAT. Calculation: £8,500 collected - £6,200 paid = £2,300 statutory payment liability (Box 5 total)."
    },
    {
        id: 11,
        chapter: 4,
        type: "select",
        points: 10,
        instruction: "Complete the statutory statement governing HMRC reporting obligations for small business operations.",
        content: `
            <div style="line-height: 2; font-size: 1.05rem;">
                A small enterprise generating credit transactions can elect to deploy the specialized VAT Cash Accounting Scheme to adjust reporting boundaries, meaning tax is logged only when 
                <select class="multi-select-field" data-ans="cash">
                    <option value="">-- Condition A --</option>
                    <option value="invoice">The sales invoice is officially raised</option>
                    <option value="cash">Physical cash cash-in hits the bank account</option>
                </select> 
                rather than tracking the transaction on standard 
                <select class="multi-select-field" data-ans="accrual">
                    <option value="">-- Condition B --</option>
                    <option value="accrual">Accrual or invoice-date baselines</option>
                    <option value="proforma">Pro-forma estimate ledger parameters</option>
                </select>.
            </div>
        `,
        solution: "The Cash Accounting Scheme helps small business cash flows by calculating VAT liabilities strictly on real cash movements, eliminating tax exposure on unpaid client invoices."
    },
    {
        id: 12,
        chapter: 4,
        type: "input",
        points: 15,
        instruction: "An individual trader files their quarterly VAT return 45 days past the statutory deadline. HMRC applies a flat-rate regulatory penalty charge of £400 on the late submission. Input the exact monetary penalty level recorded.",
        content: `
            <table class="financial-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">TPFB Penalty and Default Surcharge Matrix</th>
                        <th style="width: 250px;">Penalty Value (£)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;">Statutory Late Submission Levy (Integer value)</td>
                        <td><input type="text" class="multi-input-field numeric-field" data-ans="400" placeholder="0"></td>
                    </tr>
                </tbody>
            </table>
        `,
        solution: "Late filing or payment defaults trigger automatic flat or sliding penalty tiers under HMRC compliance codes. The undisputed recorded levy is £400."
    }
];

let examQuestions = []; 
let currentTabActive = 0;
let timeRemainingSeconds = 3600;
let examTimerInterval = null;
let isExamSubmitted = false;
window.addEventListener('DOMContentLoaded', () => { initExamEngine(); });

function initExamEngine() {
    examQuestions = [...questionsDatabase].sort(() => Math.random() - 0.5);
    generateTabs();
    generatePanels();
    activateTab(0);
    startExamTimer();
}

function generateTabs() {
    const container = document.getElementById('exam-tabs-headers');
    if (!container) return;
    container.innerHTML = '';
    examQuestions.forEach((q, index) => {
        container.innerHTML += `<button type="button" class="tab-trigger-btn" id="tab-trigger-${index}" onclick="activateTab(${index})">Task ${index + 1} <span style="font-size:0.7rem; background:#E5E7EB; padding:1px 3px; border-radius:2px;">${q.points}pt</span></button>`;
    });
}

function generatePanels() {
    const container = document.getElementById('exam-panels-container');
    if (!container) return;
    container.innerHTML = '';
    
    examQuestions.forEach((q, index) => {
        const panel = document.createElement('div');
        panel.className = 'exam-task-panel';
        panel.id = `task-panel-${index}`;
        
        panel.innerHTML = `
        <div style="font-size:0.75rem; color:#6B7280; font-weight:600; margin-bottom:0.25rem; text-transform: uppercase;">CHAPTER ${q.chapter} Focus</div>
        <div style="font-weight:600; margin-bottom:0.75rem; color:#111827;">${q.instruction}</div>
        <div class="task-interactive-body">${q.content}</div>
        
        <div class="feedback-box hidden" id="feedback-panel-${index}" style="display: none; margin-top: 1rem; padding: 1rem; border-radius: 6px;">
            <div id="feedback-title-${index}" style="font-weight:700; margin-bottom:0.5rem;"></div>
            <div style="font-size:0.85rem; color:#4B5563; padding-top:0.5rem; border-top:1px dashed rgba(0,0,0,0.15);">
                <strong>Solution Note:</strong> ${q.explanation}
            </div>
        </div>
        `;
        container.appendChild(panel);
    });
}

function activateTab(index) {
    if (index < 0 || index >= examQuestions.length) return;
    document.querySelectorAll('.tab-trigger-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.exam-task-panel').forEach(p => {
        p.classList.remove('active');
        p.style.display = 'none';
    });
    
    document.getElementById(`tab-trigger-${index}`).classList.add('active');
    const activePanel = document.getElementById(`task-panel-${index}`);
    activePanel.classList.add('active');
    activePanel.style.display = 'block';
    
    currentTabActive = index;
    document.getElementById('btn-prev').disabled = (index === 0);
    document.getElementById('btn-next').disabled = (index === examQuestions.length - 1);
}

function navPrev() { if (currentTabActive > 0) activateTab(currentTabActive - 1); }
function navNext() { if (currentTabActive < examQuestions.length - 1) activateTab(currentTabActive + 1); }

function submitExam() {
    if (isExamSubmitted) return;
    clearInterval(examTimerInterval);
    isExamSubmitted = true;
    let available = 0, awarded = 0;
    
    examQuestions.forEach((q, index) => {
        const panel = document.getElementById(`task-panel-${index}`);
        const feedbackBox = document.getElementById(`feedback-panel-${index}`);
        const feedbackTitle = document.getElementById(`feedback-title-${index}`);
        available += q.points;
        let isCorrect = true;

        if (q.type === "radio") {
            const sel = panel.querySelector(`input[name="q${q.id}"]:checked`);
            isCorrect = (sel && sel.value === q.correct);
        } else {
            panel.querySelectorAll('input[data-ans]').forEach(i => {
                if (i.value.trim().toLowerCase() !== i.getAttribute('data-ans').trim().toLowerCase()) {
                    isCorrect = false;
                    i.style.borderColor = "#DC2626";
                } else {
                    i.style.borderColor = "#059669";
                }
                i.disabled = true;
            });
        }
        
        feedbackBox.style.display = 'block';
        feedbackBox.classList.remove('hidden');
        
        if (isCorrect) {
            awarded += q.points;
            feedbackBox.style.backgroundColor = "#DEF7EC";
            feedbackBox.style.borderLeft = "4px solid #059669";
            feedbackTitle.innerHTML = `✔️ Correct! (+${q.points} Pts)`;
            feedbackTitle.style.color = "#065F46";
        } else {
            feedbackBox.style.backgroundColor = "#FDE8E8";
            feedbackBox.style.borderLeft = "4px solid #DC2626";
            feedbackTitle.innerHTML = `❌ Incorrect! (0 / ${q.points} Pts)`;
            feedbackTitle.style.color = "#9B1C1C";
        }
    });
    
    const score = available > 0 ? Math.round((awarded / available) * 100) : 0;
    document.getElementById('res-score').textContent = `${score}%`;
    document.getElementById('res-points').textContent = `${awarded} / ${available}`;
    
    const outcomeField = document.getElementById('res-outcome');
    if (score >= 70) {
        outcomeField.textContent = "PASS (Competent)";
        outcomeField.style.color = "#059669";
    } else {
        outcomeField.textContent = "FAIL (Not Yet Competent)";
        outcomeField.style.color = "#DC2626";
    }
    
    document.querySelectorAll('.feedback-box').forEach(fb => {
        fb.style.display = 'block';
        fb.classList.remove('hidden');
    });
    document.getElementById('results-card').classList.remove('hidden');
    alert(`Assessment submitted! Your score is ${score}%`);
}

function resetExam() {
    if (confirm("Reset current exam session? All inputs will be wiped.")) {
        clearInterval(examTimerInterval);
        isExamSubmitted = false;
        timeRemainingSeconds = 3600;
        document.getElementById('exam-timer').style.color = "#FFFFFF";
        document.getElementById('results-card').classList.add('hidden');
        initExamEngine();
    }
}

function startExamTimer() {
    const display = document.getElementById('exam-timer');
    examTimerInterval = setInterval(() => {
        if (timeRemainingSeconds <= 0) {
            clearInterval(examTimerInterval);
            submitExam();
        } else {
            timeRemainingSeconds--;
            let min = Math.floor(timeRemainingSeconds / 60), sec = timeRemainingSeconds % 60;
            display.textContent = `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
            if (timeRemainingSeconds < 300) display.style.color = "#DC2626";
        }
    }, 1000);
}

function toggleCalc() {
    const c = document.getElementById('neon-calc');
    c.style.display = (c.style.display === 'block') ? 'none' : 'block';
}

function pressNum(n) {
    const d = document.getElementById('calc-display');
    d.value = (d.value === '0') ? n : d.value + n;
}

function pressOp(o) { document.getElementById('calc-display').value += o; }
function clearCalc() { document.getElementById('calc-display').value = '0'; }
function calcResult() {
    const d = document.getElementById('calc-display');
    try { d.value = eval(d.value); } catch(e) { d.value = 'Error'; }
}

// Logica di trascinamento Drag and Drop per la calcolatrice originale
const calcPanel = document.getElementById('neon-calc');
const calcHeader = document.getElementById('calc-header');
let activeDrag = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

if (calcHeader && calcPanel) {
    calcHeader.addEventListener('mousedown', (e) => {
        initialX = e.clientX - xOffset;
        initialY = e.clientY - yOffset;
        activeDrag = true;
    });
    document.addEventListener('mouseup', () => { activeDrag = false; });
    document.addEventListener('mousemove', (e) => {
        if (!activeDrag) return;
        e.preventDefault();
        currentX = e.clientX - initialX;
        currentY = e.clientY - initialY;
        xOffset = currentX;
        yOffset = currentY;
        calcPanel.style.transform = `translate(${currentX}px, ${currentY}px)`;
    });
}
</script>
