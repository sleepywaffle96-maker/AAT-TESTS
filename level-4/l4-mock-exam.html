<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAT Level 4 Professional - Official Style Mock Exam</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* ========================================== */
        /* DESIGN SYSTEM & CORE INTERFACCIA ASSESSMENT */
        /* ========================================== */
        :root {
            --bg-dark-external: #0B0F19;
            --bubble-white-bg: #FFFFFF;
            --l2-emerald-primary: #B45309; /* Ricalibrato su tonalità Livello 4 */
            --l2-emerald-dark: #9A3412;
            --l2-emerald-light: #FFEDD5;
            --text-dark: #1F2937;
            --text-muted: #4B5563;
            --border-color: #E5E7EB;
            --danger-color: #DC2626;
            --success-box-bg: #DEF7EC;
            --neon-calc-accent: #00FF66;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark-external);
            color: var(--text-dark);
            margin: 0;
            padding-top: 80px;
        }
        /* CORREZIONE CROMATICA LIVELLO 4 - FORZATURA ARANCIONE BRAND SEZIONI */
        .exam-top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: #111827;
            border-bottom: 2px solid #F97316; /* Cambiato in Arancione Livello 4 */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            box-sizing: border-box;
            z-index: 1000;
        }

        .top-bar-title {
            color: #FFFFFF;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }
        .timer-container {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .timer-countdown {
            font-family: 'JetBrains Mono', monospace;
            color: #FFFFFF;
            font-weight: 700;
            background: #1F2937;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            font-size: 1.1rem;
            border: 1px solid #374151;
        }
        .exam-main-wrapper {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .white-bubble-container {
            background-color: var(--bubble-white-bg);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
        }
        .exam-tabs-navigation {
            display: flex;
            gap: 0.35rem;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 1px;
        }
        .tab-trigger-btn {
            background: #F3F4F6;
            border: 1px solid var(--border-color);
            border-bottom: none;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            white-space: nowrap;
            transition: all 0.15s ease;
        }
        .tab-trigger-btn:hover { background: #E5E7EB; }
       .tab-trigger-btn.active {
            background: var(--bubble-white-bg);
            color: #F97316 !important; /* Testo attivo Arancione */
            border-top: 3px solid #F97316 !important; /* Linea superiore attiva Arancione */
            padding-bottom: calc(0.6rem + 2px);
            margin-bottom: -2px;
        }
        .exam-task-panel { display: none; }
        .exam-task-panel.active { display: block; }
        .task-interactive-body {
            background-color: #FAFAFA;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1.5rem 0;
        }
        .financial-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: #FFFFFF;
        }
        .financial-table th {
            background-color: var(--l2-emerald-dark);
            color: #FFFFFF;
            padding: 0.6rem;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--l2-emerald-dark);
        }
        .financial-table td {
            border: 1px solid var(--border-color);
            padding: 0.6rem;
            font-size: 0.9rem;
        }
        .table-input {
            width: 100%;
            padding: 0.4rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        .text-right { text-align: right; }
        .text-left { text-align: left; }
        .option-label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 0.5rem;
        }
        .exam-footer-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--border-color);
        }
        .ctrl-btn {
            padding: 0.65rem 1.25rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
        }
        .btn-secondary { background: #E5E7EB; color: var(--text-dark); }
        .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-danger { background: var(--danger-color); color: #FFFFFF; }
        .btn-success { background: var(--l2-emerald-primary); color: #FFFFFF; }
        .tool-btn { background: #374151; color: #FFF; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
        .exam-results-card {
            margin-top: 2rem;
            background: #F9FAFB;
            border: 2px solid var(--l2-emerald-primary);
            border-radius: 8px;
            padding: 1.5rem;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }
        .result-metric {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            padding: 1.2rem;
            border-radius: 6px;
            text-align: center;
        }
        .metric-label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem; }
        .metric-value { font-size: 1.4rem; font-weight: 700; color: var(--l2-emerald-dark); }
        .drag-calculator-panel {
            position: fixed;
            top: 85px;
            right: 30px;
            width: 240px;
            background: #111827;
            border: 2px solid var(--neon-calc-accent);
            border-radius: 8px;
            display: none;
            z-index: 2000;
        }
        .calc-header {
            background: #1F2937;
            padding: 0.5rem;
            color: var(--neon-calc-accent);
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #374151;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
        }
        .calc-display-input {
            width: 100%;
            background: #000000;
            color: var(--neon-calc-accent);
            border: 1px solid #374151;
            text-align: right;
            padding: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .calc-grid-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; margin-top: 0.5rem; }
        .calc-btn { background: #374151; color: #FFFFFF; border: none; padding: 0.55rem; cursor: pointer; font-weight: 700; border-radius: 4px; }
        .btn-equal { background: var(--neon-calc-accent); color: #000000; grid-row: span 2; display: flex; align-items: center; justify-content: center; }
        .feedback-box { margin-top: 1.2rem; padding: 1.2rem; border-radius: 6px; border-left: 4px solid; }
        .hidden { display: none !important; }

        @media print {
            body { background: #FFFFFF !important; padding-top: 0 !important; color: #000000 !important; }
            .exam-top-bar, .exam-tabs-navigation, .exam-footer-controls, .drag-calculator-panel { display: none !important; }
            .exam-main-wrapper { margin: 0 !important; padding: 0 !important; max-width: 100% !important; }
            .white-bubble-container { border: none !important; box-shadow: none !important; padding: 0 !important; }
            .exam-task-panel { display: block !important; page-break-after: always; }
            .task-interactive-body { background: #FFFFFF !important; border: 1px solid #000000 !important; }
            .exam-results-card { display: block !important; border: 2px solid #000000 !important; background: #FFFFFF !important; page-break-before: always; }
            input { border: none !important; border-bottom: 1px solid #000000 !important; background: transparent !important; }
        }
    </style>
</head>
<body>
    <!-- BARRA FISSA SUPERIORE -->
    <div class="exam-top-bar">
        <div class="top-bar-title">🏆 AAT LEVEL 4: APMA & FSLC LIVE ASSESSMENT</div>
        <div class="timer-container">
            <button type="button" class="tool-btn" onclick="toggleCalc()">🧮 Calculator</button>
            <div id="exam-timer" class="timer-countdown">60:00</div>
        </div>
    </div>

    <!-- BOLLA BIANCA CENTRALE -->
    <main class="exam-main-wrapper">
        <div class="white-bubble-container">
            <!-- SCHEDE TASK -->
            <div class="exam-tabs-navigation" id="exam-tabs-headers"></div>
            
            <!-- CONTENITORE DOMANDE -->
            <form id="mock-exam-form" onsubmit="event.preventDefault();">
                <div id="exam-panels-container"></div>
            </form>
            
            <!-- PULSANTI DI CONTROLLO -->
            <div class="exam-footer-controls">
                <div>
                    <button type="button" class="ctrl-btn btn-secondary" id="btn-prev" onclick="navPrev()">⬅️ Previous</button>
                    <button type="button" class="ctrl-btn btn-secondary" id="btn-next" onclick="navNext()">Next ➡️</button>
                </div>
                <div>
                    <button type="button" class="ctrl-btn btn-danger" onclick="resetExam()">🔄 Reset</button>
                    <button type="button" class="ctrl-btn btn-success" onclick="submitExam()">🏆 Submit</button>
                </div>
            </div>

            <!-- TABELLA RISULTATI (NASCROSTA DI DEFAULT) -->
            <div class="exam-results-card hidden" id="results-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; border-bottom:2px solid #E5E7EB; padding-bottom:0.5rem;">
                    <h2 style="color:#111827; margin:0; font-size:1.3rem;">Official Performance Report</h2>
                    <button type="button" class="ctrl-btn btn-secondary" onclick="window.print()">📄Download as PDF (A4 Print)</button>
                </div>
                <div class="results-grid">
                    <div class="result-metric">
                        <span class="metric-label">Final Grade</span>
                        <span class="metric-value" id="res-score">0%</span>
                    </div>
                    <div class="result-metric">
                        <span class="metric-label">Points Awarded</span>
                        <span class="metric-value" id="res-points">0 / 100</span>
                    </div>
                    <div class="result-metric">
                        <span class="metric-label">Outcome</span>
                        <span class="metric-value" id="res-outcome">-</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- WIDGET CALCOLATRICE NEON POP-UP -->
    <div class="drag-calculator-panel" id="neon-calc">
        <div class="calc-header" id="calc-header">AAT SYSTEM CALCULATOR <span onclick="toggleCalc()" style="cursor:pointer; font-size:1.2rem;">✕</span></div> 
        <div style="padding:0.6rem;">
            <input type="text" id="calc-display" class="calc-display-input" readonly value="0">
            <div class="calc-grid-buttons">
                <button type="button" class="calc-btn" style="color:#F87171;" onclick="clearCalc()">C</button>
                <button type="button" class="calc-btn" style="color:#00FF66;" onclick="pressOp('/')">/</button>
                <button type="button" class="calc-btn" style="color:#00FF66;" onclick="pressOp('*')">*</button>
                <button type="button" class="calc-btn" style="color:#00FF66;" onclick="pressOp('-')">-</button>
                <button type="button" class="calc-btn" onclick="pressNum('7')">7</button>
                <button type="button" class="calc-btn" onclick="pressNum('8')">8</button>
                <button type="button" class="calc-btn" onclick="pressNum('9')">9</button>
                <button type="button" class="calc-btn style-plus" style="color:#00FF66;" onclick="pressOp('+')">+</button>
                <button type="button" class="calc-btn" onclick="pressNum('4')">4</button>
                <button type="button" class="calc-btn" onclick="pressNum('5')">5</button>
                <button type="button" class="calc-btn" onclick="pressNum('6')">6</button>
                <button type="button" class="calc-btn btn-equal" onclick="calcResult('=')">=</button>
                <button type="button" class="calc-btn" onclick="pressNum('1')">1</button>
                <button type="button" class="calc-btn" onclick="pressNum('2')">2</button>
                <button type="button" class="calc-btn" onclick="pressNum('3')">3</button>
                <button type="button" class="calc-btn" style="grid-column: span 2;" onclick="pressNum('0')">0</button>
                <button type="button" class="calc-btn" onclick="pressNum('.')">.</button>
            </div>
        </div>
    </div>
<script>
const questionsDatabase = [
    {
        id: 1,
        chapter: 1,
        type: "input",
        points: 15,
        instruction: "Under AMA principles, a firm uses Activity-Based Costing (ABC). Total machinery setup overhead costs are £40,000, and the total number of setups (cost driver) is 200. Compute the budgeted Activity Cost Driver Rate per setup.",
        content: `
            <table class="financial-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">AMA Activity-Based Costing Framework</th>
                        <th style="width: 250px;">Calculated Driver Rate (£)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;">Cost Driver Rate per Machinery Setup (Integer value)</td>
                        <td><input type="text" class="multi-input-field numeric-field" data-ans="200" placeholder="0"></td>
                    </tr>
                </tbody>
            </table>
        `,
        solution: "Activity Cost Driver Rate = Total Activity Cost Pool / Total Cost Driver Volume. Calculation: £40,000 / 200 setups = £200 per setup."
    },
    {
        id: 2,
        chapter: 1,
        type: "select",
        points: 10,
        instruction: "Complete the short-term strategic throughput evaluation statement under target optimization criteria.",
        content: `
            <div style="line-height: 2; font-size: 1.05rem;">
                When identifying manufacturing production blockages under the Theory of Constraints, an asset that restricts total factory throughput velocity is defined as a 
                <select class="multi-select-field" data-ans="bottleneck">
                    <option value="">-- Select Term --</option>
                    <option value="variance">Budget variance allocation</option>
                    <option value="bottleneck">Bottleneck resource element</option>
                </select> 
                and operations must focus on maximizing the contribution per bottleneck 
                <select class="multi-select-field" data-ans="hour">
                    <option value="">-- Select Metric --</option>
                    <option value="hour">Hour of utilized machine capacity</option>
                    <option value="unit">Raw material unit weight addition</option>
                </select>.
            </div>
        `,
        solution: "A bottleneck dictates total system velocity. To maximize profitability under constraint environments, production scheduling must prioritize products generating the highest throughput return per bottleneck hour."
    },
    {
        id: 3,
        chapter: 1,
        type: "input",
        points: 15,
        instruction: "A project requires an initial cash investment of £100,000 and generates a single forecasted cash inflow of £110,000 at the end of Year 1. Assume the company's cost of capital discount factor is exactly 5% (discount multiplier = 0.9524). Compute the Net Present Value (NPV) of this investment.",
        content: `
            <table class="financial-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">AMA Capital Investment Appraisal Matrix</th>
                        <th style="width: 250px;">Net Present Value (£)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;">Calculated Project NPV (Round to nearest integer value)</td>
                        <td><input type="text" class="multi-input-field numeric-field" data-ans="4764" placeholder="0"></td>
                    </tr>
                </tbody>
            </table>
        `,
        solution: "Present Value of Inflow = £110,000 × 0.9524 = £104,764. Net Present Value = PV of Inflows - Initial Investment = £104,764 - £100,000 = £4,764."
    },
    {
        id: 4,
        chapter: 2,
        type: "input",
        points: 15,
        instruction: "Under IAS 1 rules, a corporate group prepares its consolidated account sheets. The parent company acquires 80% of a subsidiary's shares. During the year, the subsidiary generates a net profit of £50,000. Compute the dollar value layer belonging to the Non-Controlling Interest (NCI).",
        content: `
            <table class="financial-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">DAIF Consolidated Statement of Profit or Loss</th>
                        <th style="width: 250px;">NCI Profit Share (£)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;">Non-Controlling Interest Share Value (Integer value)</td>
                        <td><input type="text" class="multi-input-field numeric-field" data-ans="10000" placeholder="0"></td>
                    </tr>
                </tbody>
            </table>
        `,
        solution: "NCI holds 100% - 80% = 20% of equity. Non-Controlling Interest profit share = £50,000 total subsidiary profit × 20% allocation rate = £10,000."
    },
    {
        id: 5,
        chapter: 2,
        type: "select",
        points: 10,
        instruction: "Complete the financial reporting description addressing group unrealized profit adjustments across inventory items.",
        content: `
            <div style="line-height: 2; font-size: 1.05rem;">
                When a parent company sells goods to a subsidiary at a margin and these items remain inside close stocks at year-end, the group accountant must remove the 
                <select class="multi-select-field" data-ans="pup">
                    <option value="">-- Adjustment Term --</option>
                    <option value="pup">Provision for Unrealized Profit (PUP)</option>
                    <option value="allowance">Annual investment allowance allocation</option>
                </select> 
                to prevent artificial consolidation overstatements across group retained earnings and 
                <select class="multi-select-field" data-ans="inventory">
                    <option value="">-- Target Line --</option>
                    <option value="inventory">Group closing inventory asset values</option>
                    <option value="liabilities">Long-term deferred tax liability pools</option>
                </select>.
            </div>
        `,
        solution: "Intragroup paper profits on items still held within the group boundaries must be deleted via a PUP adjustment, reducing consolidated inventory assets and group retained reserves."
    },
    {
        id: 6,
        chapter: 2,
        type: "input",
        points: 15,
        instruction: "A limited company reports a Net Profit after Tax of £30,000 and has a total Equity Share Capital base of £150,000. Calculate the Return on Equity (ROE) efficiency percentage factor (enter strictly the integer percentage value).",
        content: `
            <table class="financial-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">DAIF Interpretation of Ratios Metric</th>
                        <th style="width: 250px;">Resulting Efficiency (%)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;">Return on Equity percentage rate (Input integer value only)</td>
                        <td><input type="text" class="multi-input-field numeric-field" data-ans="20" placeholder="0"></td>
                    </tr>
                </tbody>
            </table>
        `,
        solution: "ROE Formula = (Net Profit after Tax / Total Equity Share Capital) × 100. Calculation: (£30,000 / £150,000) × 100 = 20% efficiency return."
    },
    {
        id: 7,
        chapter: 3,
        type: "select",
        points: 10,
        instruction: "Complete the risk governance statement addressing internal control breakdowns under IASC guidelines.",
        content: `
            <div style="line-height: 2; font-size: 1.05rem;">
                When a single senior executive holds unrestricted access to both initiate bank payments and complete general ledger reconciliations, this represents a severe failure in 
                <select class="multi-select-field" data-ans="segregation">
                    <option value="">-- Control Principle --</option>
                    <option value="segregation">Segregation of duties parameters</option>
                    <option value="minimisation">Data minimisation security frameworks</option>
                </select> 
                which introduces a critical opportunity for undetected corporate 
                <select class="multi-select-field" data-ans="fraud">
                    <option value="">-- System Threat --</option>
                    <option value="variance">Flexible cost budget variance logging</option>
                    <option value="fraud">Fraud, misappropriation, or reporting distortion</option>
                </select>.
            </div>
        `,
        solution: "No individual should control multiple consecutive phases of a financial transaction. Separating duties provides an internal validation shield that prevents errors or fraud."
    },
    {
        id: 8,
        chapter: 4,
        type: "input",
        points: 15,
        instruction: "A large corporate company buys plant machinery for £10,000 during the fiscal tax year. Assume the current corporate tax parameters grant a standard Annual Investment Allowance (AIA) rate of 100% writing-down write-off for qualifying additions. Calculate the absolute capital allowance deduction value available to reduce the current period taxable profits pool.",
        content: `
            <table class="financial-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">BSTX Statutory Capital Allowances Matrix</th>
                        <th style="width: 250px;">Tax Write-Off (£)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;">Calculated AIA capital deduction value (Integer value)</td>
                        <td><input type="text" class="multi-input-field numeric-field" data-ans="10000" placeholder="0"></td>
                    </tr>
                </tbody>
            </table>
        `,
        solution: "Qualifying additions within the corporate AIA cap ceiling are written off completely at 100% in the purchase period. Calculation: £10,000 addition × 100% flat allowance rate = £10,000 tax deduction."
    },
    {
        id: 9,
        chapter: 4,
        type: "select",
        points: 10,
        instruction: "Select the statutory tax adjustment required to convert accounting profit into taxable trading profit.",
        content: `
            <div style="line-height: 2; font-size: 1.05rem;">
                To extract corporate taxable trading profits from historical accounts figures, standard accounting depreciation charges must be 
                <select class="multi-select-field" data-ans="added">
                    <option value="">-- Adjustment A --</option>
                    <option value="added">Added back onto net accounting profits</option>
                    <option value="deducted">Deducted from net accounting profits</option>
                </select> 
                and subsequently replaced by HMRC approved 
                <select class="multi-select-field" data-ans="allowances">
                    <option value="">-- Adjustment B --</option>
                    <option value="allowances">Capital allowances writing down rules</option>
                    <option value="variances">Flexible budget variance log lines</option>
                </select>.
            </div>
        `,
        solution: "Commercial accounting depreciation is disallowable under statutory tax codes. It must be added back onto the profit pool and replaced by capital allowances."
    },
    {
        id: 10,
        chapter: 5,
        type: "input",
        points: 15,
        instruction: "An individual taxpayer registers an Adjusted Net Income of £110,000 during the tax year. Assume the maximum initial standard personal allowance is £12,570, tapered downwards by £1 for every £2 earned above the £100,000 threshold baseline. Compute the individual's remaining available Adjusted Personal Allowance.",
        content: `
            <table class="financial-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">PLTX Personal Allowance Taper Trap Tracker</th>
                        <th style="width: 250px;">Remaining Allowance (£)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;">Adjusted Personal Allowance Value (Integer value)</td>
                        <td><input type="text" class="multi-input-field numeric-field" data-ans="7570" placeholder="0"></td>
                    </tr>
                </tbody>
            </table>
        `,
        solution: "Excess income = £110,000 - £100,000 = £10,000. Taper deduction = £10,000 / 2 = £5,000. Remaining allowance = £12,570 - £5,000 = £7,570."
    },
    {
        id: 11,
        chapter: 5,
        type: "select",
        points: 10,
        instruction: "Complete the capital gains tax analysis describing sliding percentage metrics for individuals.",
        content: `
            <div style="line-height: 2; font-size: 1.05rem;">

let examQuestions = []; 
let currentTabActive = 0;
let timeRemainingSeconds = 3600;
let examTimerInterval = null;
let isExamSubmitted = false;
window.addEventListener('DOMContentLoaded', () => { initExamEngine(); });

function initExamEngine() {
    examQuestions = [...questionsDatabase].sort(() => Math.random() - 0.5);
    generateTabs();
    generatePanels();
    activateTab(0);
    startExamTimer();
}

function generateTabs() {
    const container = document.getElementById('exam-tabs-headers');
    if (!container) return;
    container.innerHTML = '';
    examQuestions.forEach((q, index) => {
        container.innerHTML += `<button type="button" class="tab-trigger-btn" id="tab-trigger-${index}" onclick="activateTab(${index})">Task ${index + 1} <span style="font-size:0.7rem; background:#E5E7EB; padding:1px 3px; border-radius:2px;">${q.points}pt</span></button>`;
    });
}

function generatePanels() {
    const container = document.getElementById('exam-panels-container');
    if (!container) return;
    container.innerHTML = '';
    
    examQuestions.forEach((q, index) => {
        const panel = document.createElement('div');
        panel.className = 'exam-task-panel';
        panel.id = `task-panel-${index}`;
        
        panel.innerHTML = `
        <div style="font-size:0.75rem; color:#6B7280; font-weight:600; margin-bottom:0.25rem; text-transform: uppercase;">CHAPTER ${q.chapter} Focus</div>
        <div style="font-weight:600; margin-bottom:0.75rem; color:#111827;">${q.instruction}</div>
        <div class="task-interactive-body">${q.content}</div>
        
        <div class="feedback-box hidden" id="feedback-panel-${index}" style="display: none; margin-top: 1rem; padding: 1rem; border-radius: 6px;">
            <div id="feedback-title-${index}" style="font-weight:700; margin-bottom:0.5rem;"></div>
            <div style="font-size:0.85rem; color:#4B5563; padding-top:0.5rem; border-top:1px dashed rgba(0,0,0,0.15);">
                <strong>Solution Note:</strong> ${q.explanation}
            </div>
        </div>
        `;
        container.appendChild(panel);
    });
}

function activateTab(index) {
    if (index < 0 || index >= examQuestions.length) return;
    document.querySelectorAll('.tab-trigger-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.exam-task-panel').forEach(p => {
        p.classList.remove('active');
        p.style.display = 'none';
    });
    
    document.getElementById(`tab-trigger-${index}`).classList.add('active');
    const activePanel = document.getElementById(`task-panel-${index}`);
    activePanel.classList.add('active');
    activePanel.style.display = 'block';
    
    currentTabActive = index;
    document.getElementById('btn-prev').disabled = (index === 0);
    document.getElementById('btn-next').disabled = (index === examQuestions.length - 1);
}

function navPrev() { if (currentTabActive > 0) activateTab(currentTabActive - 1); }
function navNext() { if (currentTabActive < examQuestions.length - 1) activateTab(currentTabActive + 1); }

function submitExam() {
    if (isExamSubmitted) return;
    clearInterval(examTimerInterval);
    isExamSubmitted = true;
    let available = 0, awarded = 0;
    
    examQuestions.forEach((q, index) => {
        const panel = document.getElementById(`task-panel-${index}`);
        const feedbackBox = document.getElementById(`feedback-panel-${index}`);
        const feedbackTitle = document.getElementById(`feedback-title-${index}`);
        available += q.points;
        let isCorrect = true;

        if (q.type === "radio") {
            const sel = panel.querySelector(`input[name="q${q.id}"]:checked`);
            isCorrect = (sel && sel.value === q.correct);
        } else {
            panel.querySelectorAll('input[data-ans]').forEach(i => {
                if (i.value.trim().toLowerCase() !== i.getAttribute('data-ans').trim().toLowerCase()) {
                    isCorrect = false;
                    i.style.borderColor = "#DC2626";
                } else {
                    i.style.borderColor = "#059669";
                }
                i.disabled = true;
            });
        }
        
        feedbackBox.style.display = 'block';
        feedbackBox.classList.remove('hidden');
        
        if (isCorrect) {
            awarded += q.points;
            feedbackBox.style.backgroundColor = "#DEF7EC";
            feedbackBox.style.borderLeft = "4px solid #059669";
            feedbackTitle.innerHTML = `✔️ Correct! (+${q.points} Pts)`;
            feedbackTitle.style.color = "#065F46";
        } else {
            feedbackBox.style.backgroundColor = "#FDE8E8";
            feedbackBox.style.borderLeft = "4px solid #DC2626";
            feedbackTitle.innerHTML = `❌ Incorrect! (0 / ${q.points} Pts)`;
            feedbackTitle.style.color = "#9B1C1C";
        }
    });
    
    const score = available > 0 ? Math.round((awarded / available) * 100) : 0;
    document.getElementById('res-score').textContent = `${score}%`;
    document.getElementById('res-points').textContent = `${awarded} / ${available}`;
    
    const outcomeField = document.getElementById('res-outcome');
    if (score >= 70) {
        outcomeField.textContent = "PASS (Competent)";
        outcomeField.style.color = "#059669";
    } else {
        outcomeField.textContent = "FAIL (Not Yet Competent)";
        outcomeField.style.color = "#DC2626";
    }
    
    document.querySelectorAll('.feedback-box').forEach(fb => {
        fb.style.display = 'block';
        fb.classList.remove('hidden');
    });
    document.getElementById('results-card').classList.remove('hidden');
    alert(`Assessment submitted! Your score is ${score}%`);
}

function resetExam() {
    if (confirm("Reset current exam session? All inputs will be wiped.")) {
        clearInterval(examTimerInterval);
        isExamSubmitted = false;
        timeRemainingSeconds = 3600;
        document.getElementById('exam-timer').style.color = "#FFFFFF";
        document.getElementById('results-card').classList.add('hidden');
        initExamEngine();
    }
}

function startExamTimer() {
    const display = document.getElementById('exam-timer');
    examTimerInterval = setInterval(() => {
        if (timeRemainingSeconds <= 0) {
            clearInterval(examTimerInterval);
            submitExam();
        } else {
            timeRemainingSeconds--;
            let min = Math.floor(timeRemainingSeconds / 60), sec = timeRemainingSeconds % 60;
            display.textContent = `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
            if (timeRemainingSeconds < 300) display.style.color = "#DC2626";
        }
    }, 1000);
}

function toggleCalc() {
    const c = document.getElementById('neon-calc');
    c.style.display = (c.style.display === 'block') ? 'none' : 'block';
}

function pressNum(n) {
    const d = document.getElementById('calc-display');
    d.value = (d.value === '0') ? n : d.value + n;
}

function pressOp(o) { document.getElementById('calc-display').value += o; }
function clearCalc() { document.getElementById('calc-display').value = '0'; }
function calcResult() {
    const d = document.getElementById('calc-display');
    try { d.value = eval(d.value); } catch(e) { d.value = 'Error'; }
}

// Logica di trascinamento Drag and Drop per la calcolatrice originale
const calcPanel = document.getElementById('neon-calc');
const calcHeader = document.getElementById('calc-header');
let activeDrag = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

if (calcHeader && calcPanel) {
    calcHeader.addEventListener('mousedown', (e) => {
        initialX = e.clientX - xOffset;
        initialY = e.clientY - yOffset;
        activeDrag = true;
    });
    document.addEventListener('mouseup', () => { activeDrag = false; });
    document.addEventListener('mousemove', (e) => {
        if (!activeDrag) return;
        e.preventDefault();
        currentX = e.clientX - initialX;
        currentY = e.clientY - initialY;
        xOffset = currentX;
        yOffset = currentY;
        calcPanel.style.transform = `translate(${currentX}px, ${currentY}px)`;
    });
}
</script>
