<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAT Level 2 BTRN - Official Style Mock Exam</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* ========================================== */
        /* DESIGN SYSTEM & CORE INTERFACCIA ASSESSMENT */
        /* ========================================== */
        :root {
            --bg-dark-external: #0B0F19;
            --bubble-white-bg: #FFFFFF;
            --l2-emerald-primary: #059669;
            --l2-emerald-dark: #047857;
            --l2-emerald-light: #E6F4EA;
            --text-dark: #1F2937;
            --text-muted: #4B5563;
            --border-color: #E5E7EB;
            --danger-color: #DC2626;
            --success-box-bg: #DEF7EC;
            --neon-calc-accent: #00FF66;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark-external);
            color: var(--text-dark);
            margin: 0;
            padding-top: 80px;
        }

        .exam-top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: #111827;
            border-bottom: 2px solid var(--l2-emerald-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            box-sizing: border-box;
            z-index: 1000;
        }

        .top-bar-title {
            color: #FFFFFF;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .timer-countdown {
            font-family: 'JetBrains Mono', monospace;
            color: #FFFFFF;
            font-weight: 700;
            background: #1F2937;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            font-size: 1.1rem;
            border: 1px solid #374151;
        }

        .exam-main-wrapper {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .white-bubble-container {
            background-color: var(--bubble-white-bg);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
        }

        .exam-tabs-navigation {
            display: flex;
            gap: 0.35rem;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 1px;
        }

        .tab-trigger-btn {
            background: #F3F4F6;
            border: 1px solid var(--border-color);
            border-bottom: none;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .tab-trigger-btn:hover { background: #E5E7EB; }
        .tab-trigger-btn.active {
            background: var(--bubble-white-bg);
            color: var(--l2-emerald-primary);
            border-top: 3px solid var(--l2-emerald-primary);
            padding-bottom: calc(0.6rem + 2px);
            margin-bottom: -2px;
        }

        .exam-task-panel { display: none; }
        .exam-task-panel.active { display: block; }

        .task-interactive-body {
            background-color: #FAFAFA;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1.5rem 0;
        }

        .financial-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: #FFFFFF;
        }

        .financial-table th {
            background-color: var(--l2-emerald-dark);
            color: #FFFFFF;
            padding: 0.6rem;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--l2-emerald-dark);
        }

        .financial-table td {
            border: 1px solid var(--border-color);
            padding: 0.6rem;
            font-size: 0.9rem;
        }

        .table-input {
            width: 100%;
            padding: 0.4rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .text-right { text-align: right; }
        .text-left { text-align: left; }

        .option-label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 0.5rem;
        }

        .exam-footer-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--border-color);
        }

        .ctrl-btn {
            padding: 0.65rem 1.25rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
        }

        .btn-secondary { background: #E5E7EB; color: var(--text-dark); }
        .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-danger { background: var(--danger-color); color: #FFFFFF; }
        .btn-success { background: var(--l2-emerald-primary); color: #FFFFFF; }
        .tool-btn { background: #374151; color: #FFF; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }

        .exam-results-card {
            margin-top: 2rem;
            background: #F9FAFB;
            border: 2px solid var(--l2-emerald-primary);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .result-metric {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            padding: 1.2rem;
            border-radius: 6px;
            text-align: center;
        }

        .metric-label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem; }
        .metric-value { font-size: 1.4rem; font-weight: 700; color: var(--l2-emerald-dark); }

        .drag-calculator-panel {
            position: fixed;
            top: 85px;
            right: 30px;
            width: 240px;
            background: #111827;
            border: 2px solid var(--neon-calc-accent);
            border-radius: 8px;
            display: none;
            z-index: 2000;
        }

        .calc-header {
            background: #1F2937;
            padding: 0.5rem;
            color: var(--neon-calc-accent);
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #374151;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
        }

        .calc-display-input {
            width: 100%;
            background: #000000;
            color: var(--neon-calc-accent);
            border: 1px solid #374151;
            text-align: right;
            padding: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .calc-grid-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; margin-top: 0.5rem; }
        .calc-btn { background: #374151; color: #FFFFFF; border: none; padding: 0.55rem; cursor: pointer; font-weight: 700; border-radius: 4px; }
        .btn-equal { background: var(--neon-calc-accent); color: #000000; grid-row: span 2; display: flex; align-items: center; justify-content: center; }
        
        .feedback-box {
            margin-top: 1.2rem;
            padding: 1.2rem;
            border-radius: 6px;
            border-left: 4px solid;
        }
        
        .hidden { display: none !important; }

        @media print {
            body { background: #FFFFFF !important; padding-top: 0 !important; color: #000000 !important; }
            .exam-top-bar, .exam-tabs-navigation, .exam-footer-controls, .drag-calculator-panel { display: none !important; }
            .exam-main-wrapper { margin: 0 !important; padding: 0 !important; max-width: 100% !important; }
            .white-bubble-container { border: none !important; box-shadow: none !important; padding: 0 !important; }
            .exam-task-panel { display: block !important; page-break-after: always; }
            .task-interactive-body { background: #FFFFFF !important; border: 1px solid #000000 !important; }
            .exam-results-card { display: block !important; border: 2px solid #000000 !important; background: #FFFFFF !important; page-break-before: always; }
            input { border: none !important; border-bottom: 1px solid #000000 !important; background: transparent !important; }
        }
    </style>
</head>
<body>

    <!-- BARRA FISSA SUPERIORE -->
    <div class="exam-top-bar">
        <div class="top-bar-title">🏆 AAT LEVEL 2: BTRN LIVE ASSESSMENT</div>
        <div class="timer-container">
            <button type="button" class="tool-btn" onclick="toggleCalc()">🧮 Calculator</button>
            <div id="exam-timer" class="timer-countdown">60:00</div>
        </div>
    </div>

    <!-- BOLLA BIANCA CENTRALE -->
    <main class="exam-main-wrapper">
        <div class="white-bubble-container">
            
            <!-- SCHEDE TASK -->
            <div class="exam-tabs-navigation" id="exam-tabs-headers"></div>

            <!-- CONTENITORE DOMANDE -->
            <form id="mock-exam-form" onsubmit="event.preventDefault();">
                <div id="exam-panels-container"></div>
            </form>

            <!-- PULSANTI DI CONTROLLO -->
            <div class="exam-footer-controls">
                <div>
                    <button type="button" class="ctrl-btn btn-secondary" id="btn-prev" onclick="navPrev()">⬅️ Previous</button>
                    <button type="button" class="ctrl-btn btn-secondary" id="btn-next" onclick="navNext()">Next ➡️</button>
                </div>
                <div>
                    <button type="button" class="ctrl-btn btn-danger" onclick="resetExam()">🔄 Reset</button>
                    <button type="button" class="ctrl-btn btn-success" onclick="submitExam()">🏆 Submit</button>
                </div>
            </div>

            <!-- TABELLA RISULTATI (NASCROSTA DI DEFAULT) -->
            <div class="exam-results-card hidden" id="results-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; border-bottom:2px solid #E5E7EB; padding-bottom:0.5rem;">
                    <h2 style="color:#111827; margin:0; font-size:1.3rem;">Official Performance Report</h2>
                    <button type="button" class="ctrl-btn btn-secondary" onclick="window.print()">📄 Download as PDF (A4 Print)</button>
                </div>
                <div class="results-grid">
                    <div class="result-metric">
                        <span class="metric-label">Final Grade</span>
                        <span class="metric-value" id="res-score">0%</span>
                    </div>
                    <div class="result-metric">
                        <span class="metric-label">Points Awarded</span>
                        <span class="metric-value" id="res-points">0 / 100</span>
                    </div>
                    <div class="result-metric">
                        <span class="metric-label">Outcome</span>
                        <span class="metric-value" id="res-outcome">-</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- WIDGET CALCOLATRICE NEON POP-UP -->
    <div class="drag-calculator-panel" id="neon-calc">
        <div class="calc-header" id="calc-header">AAT SYSTEM CALCULATOR <span onclick="toggleCalc()" style="cursor:pointer; font-size:1.2rem;">×</span></div>
        <div style="padding:0.6rem;">
            <input type="text" id="calc-display" class="calc-display-input" readonly value="0">
            <div class="calc-grid-buttons">
                <button type="button" class="calc-btn" style="color:#F87171;" onclick="clearCalc()">C</button>
                <button type="button" class="calc-btn" style="color:#00FF66;" onclick="pressOp('/')">/</button>
                <button type="button" class="calc-btn" style="color:#00FF66;" onclick="pressOp('*')">*</button>
                <button type="button" class="calc-btn" style="color:#00FF66;" onclick="pressOp('-')">-</button>
                <button type="button" class="calc-btn" onclick="pressNum('7')">7</button>
                <button type="button" class="calc-btn" onclick="pressNum('8')">8</button>
                <button type="button" class="calc-btn" onclick="pressNum('9')">9</button>
                <button type="button" class="calc-btn" style="color:#00FF66;" onclick="pressOp('+')">+</button>
                <button type="button" class="calc-btn" onclick="pressNum('4')">4</button>
                <button type="button" class="calc-btn" onclick="pressNum('5')">5</button>
                <button type="button" class="calc-btn" onclick="pressNum('6')">6</button>
                <button type="button" class="calc-btn btn-equal" onclick="calcResult()">=</button>
                <button type="button" class="calc-btn" onclick="pressNum('1')">1</button>
                <button type="button" class="calc-btn" onclick="pressNum('2')">2</button>
                <button type="button" class="calc-btn" onclick="pressNum('3')">3</button>
                <button type="button" class="calc-btn" style="grid-column: span 2;" onclick="pressNum('0')">0</button>
                <button type="button" class="calc-btn" onclick="pressNum('.')">.</button>
            </div>
        </div>
    </div>
<script>
const examQuestions = [
    {
        id: 1,
        type: "radio",
        question: "A business purchases a new computer for office use on credit from a supplier. Which of the following represents the correct double-entry ledger alignment to record this transaction?",
        options: [
            { text: "Debit Non-Current Assets, Credit Trade Payables", correct: true },
            { text: "Debit Trade Receivables, Credit Revenue", correct: false },
            { text: "Debit Non-Current Assets, Credit Bank Checking Account", correct: false }
        ],
        solution: "Purchasing a non-current asset on credit increases an asset account (Debit) and increases a liability account (Credit Trade Payables)."
    },
    {
        id: 2,
        type: "radio",
        question: "An invoice is issued to a customer for credit sales of £1,000 plus standard rate VAT at 20%. What values must be posted to the Sales Ledger Control Account (SLCA) and the Sales Account?",
        options: [
            { text: "Debit SLCA £1,200, Credit Sales Account £1,000", correct: true },
            { text: "Debit Sales Account £1,000, Credit SLCA £1,200", correct: false },
            { text: "Debit SLCA £1,000, Credit VAT Account £200", correct: false }
        ],
        solution: "The customer owes the full gross amount, so SLCA is debited with £1,200. Revenue is recognized net of tax, so the Sales Account is credited with £1,000."
    },
    {
        id: 3,
        type: "radio",
        question: "A company receives a prompt payment discount from a credit supplier. In which book of prime entry must this transaction be recorded before posting to the general ledger?",
        options: [
            { text: "The Cash Book / Cash Payments Daybook", correct: true },
            { text: "The Purchase Daybook", correct: false },
            { text: "The Sales Return Daybook", correct: false }
        ],
        solution: "Discounts received change the absolute cash output value required to settle a debt, meaning they are tracked directly through the Cash Book entries grid."
    },
    {
        id: 4,
        type: "radio",
        question: "While preparing a bank reconciliation, an accountant notices a cheque payment of £450 has been recorded in the cash book but does not appear on the bank statement close balance. What is this item called?",
        options: [
            { text: "An unpresented cheque", correct: true },
            { text: "An outstanding lodgement", correct: false },
            { text: "A bank automated standing order error", correct: false }
        ],
        solution: "Cheques drawn and logged internally but not yet cleared or paid out by the bank institution are classified as unpresented cheques."
    },
    {
        id: 5,
        type: "radio",
        question: "The total of the Purchase Daybook is overstated by £500 due to an extraction adding fault. What impact will this error cause on the initial Trial Balance totals?",
        options: [
            { text: "The Debit total will be £500 higher than the Credit total, causing a suspense account balance.", correct: true },
            { text: "The Credit total will be £500 higher than the Debit total.", correct: false },
            { text: "The Trial Balance will still balance perfectly because double entry balances match.", correct: false }
        ],
        solution: "Daybook total extraction errors cause an unequal posting value to ledger sides, triggering an asymmetry that forces the creation of a suspense account allocation."
    },
    {
        id: 6,
        type: "radio",
        question: "An expense payment for office rent of £1,200 has been completely omitted from both the Cash Book and the Rent Expense account. What class of error does this reveal?",
        options: [
            { text: "An error of omission, which does not break Trial Balance symmetry.", correct: true },
            { text: "An error of commission, requiring a direct journal adjustment line.", correct: false },
            { text: "A compensating error balancing different accounts rows.", correct: false }
        ],
        solution: "Errors of omission occur when a transaction is completely forgotten on both sides, meaning the Trial Balance will still match perfectly despite the missing data."
    },
    {
        id: 7,
        type: "radio",
        question: "A credit customer's check for £250 is returned by the bank marked 'Refer to Drawer' (Dishonored). What is the correct ledger adjustment to re-establish the debt asset?",
        options: [
            { text: "Debit Sales Ledger Control Account (SLCA), Credit Bank Checking Account", correct: true },
            { text: "Debit Bank Checking Account, Credit Sales Ledger Control Account (SLCA)", correct: false },
            { text: "Debit Bad Debts Provision, Credit Cash Account Balance", correct: false }
        ],
        solution: "When a check fails, the cash cash-in asset vanishes (Credit Bank) and the customer's legal obligation to pay is restored (Debit SLCA)."
    },
    {
        id: 8,
        type: "radio",
        question: "A manufacturing firm rents a production warehouse for a fixed annual payment of £24,000. How must this expenditure line be classified within cost behavior tracking matrixes?",
        options: [
            { text: "A fixed cost element that stays constant regardless of output variations.", correct: true },
            { text: "A variable cost component that flexes with manufacturing volumes.", correct: false },
            { text: "A semi-variable charge containing step-up threshold limits.", correct: false }
        ],
        solution: "Fixed costs remain completely constant over a relevant range of operational activity, unaffected by changes in manufacturing output volumes."
    },
    {
        id: 9,
        type: "radio",
        question: "A factory worker is paid a basic rate of £12 per hour for a standard 35-hour week. During a peak production cycle, they complete 5 hours of overtime paid at time-and-a-half. How much total gross salary is calculated?",
        options: [
            { text: "£510 total gross payroll entry", correct: true },
            { text: "£420 total gross payroll entry", correct: false },
            { text: "£480 total gross payroll entry", correct: false }
        ],
        solution: "Basic Pay = 35 hours × £12 = £420. Overtime Pay = 5 hours × (£12 × 1.5) = 5 × £18 = £90. Total Salary = £420 + £90 = £510."
    },
    {
        id: 10,
        type: "radio",
        question: "An engineering company features a fixed overhead burden of £50,000 and sells single component kits with a contribution margin of £5 per unit. Compute the break-even point in units.",
        options: [
            { text: "Exactly 10,000 components units to achieve zero variance profit boundaries.", correct: true },
            { text: "Exactly 5,000 components units to achieve zero variance profit boundaries.", correct: false },
            { text: "Exactly 250,000 components units to achieve zero variance profit boundaries.", correct: false }
        ],
        solution: "Break-even Point in Units = Total Fixed Costs / Contribution per Unit. Calculation: £50,000 / £5 = 10,000 units required."
    },
      {
        id: 11,
        type: "radio",
        question: "A company operates a premium inventory tracking method where materials issued to production are always priced at the value of the oldest stock currently held in the warehouse floor. What inventory system applies?",
        options: [
            { text: "First-In, First-Out (FIFO) material pricing evaluation strategy.", correct: true },
            { text: "Last-In, First-Out (LIFO) material pricing evaluation strategy.", correct: false },
            { text: "Weighted Average Cost (AVCO) material grouping allocation.", correct: false }
        ],
        solution: "The FIFO framework dictates that the earliest units loaded into inventory are the first ones issued to production lines, leaving the latest costs inside close stocks."
    },
    {
        id: 12,
        type: "radio",
        question: "Under the provisions of the Data Protection Act / GDPR, what represents a primary statutory duty of a company acting as a Data Controller when archiving financial customer profiles?",
        options: [
            { text: "To process data fairly, lawfully, and ensure it is kept secure against unauthorized data breach actions.", correct: true },
            { text: "To distribute personal profiles to external credit scoring providers without buyer consent lines.", correct: false },
            { text: "To store full data blocks indefinitely even after corporate accounts are permanently dissolved.", correct: false }
        ],
        solution: "Data security compliance mandates that corporate controllers protect customer files, limiting usage to lawful reasons and scrubbing records when data storage durations expire."
    },
    {
        id: 13,
        type: "radio",
        question: "An accounting professional is requested by a senior corporate director to cover up a material budget expenditure variance before a bank audit inspects the ledger. Which AAT fundamental ethical principle is targeted?",
        options: [
            { text: "Integrity, which commands absolute straightforwardness, honesty, and fair dealing in all professional operations.", correct: true },
            { text: "Professional Competence and Due Care capabilities.", correct: false },
            { text: "Confidentiality restrictions regarding internal corporate accounting matrixes.", correct: false }
        ],
        solution: "Integrity requires accountants to refuse any involvement with false, misleading, or doctored statements. Covering up financial discrepancies directly violates this pillar."
    },
    {
        id: 14,
        type: "radio",
        question: "Two independent business partners decide to establish a new commercial enterprise but wish to secure limited liability protection to insulate their personal property assets. What legal structure must they select?",
        options: [
            { text: "A Private Limited Company (Ltd) corporate setup.", correct: true },
            { text: "An ordinary traditional Partnership arrangement.", correct: false },
            { text: "Operating as an un-incorporated Sole Trader network.", correct: false }
        ],
        solution: "Incorporating a Private Limited Company creates a separate legal entity. This protects shareholders, limiting their personal risk to their investment capital."
    },
    {
        id: 15,
        type: "radio",
        question: "A government authority increases the baseline national minimum wage rate across the retail sector. Within macro-economic tracking models, how will this decision impact general business operations?",
        options: [
            { text: "It expands corporate variable labour expenditures, driving up production costs and shifting break-even points.", correct: true },
            { text: "It decreases aggregate consumer demand limits across local retail operations.", correct: false },
            { text: "It automatically reduces the standard interest charges levied on bank overdraft lines.", correct: false }
        ],
        solution: "Wage adjustments alter corporate expense rows. An expansion in basic payroll costs increases variable production overheads, requiring higher sale volumes to cover the new threshold."
    }
];

let examQuestions = []; 
let currentTabActive = 0;
let timeRemainingSeconds = 3600;
let examTimerInterval = null;
let isExamSubmitted = false;

window.addEventListener('DOMContentLoaded', () => { initExamEngine(); });
function initExamEngine() {
    examQuestions = [...questionsDatabase].sort(() => Math.random() - 0.5);
    generateTabs();
    generatePanels();
    activateTab(0);
    startExamTimer();
}

function generateTabs() {
    const container = document.getElementById('exam-tabs-headers');
    if (!container) return;
    container.innerHTML = '';
    examQuestions.forEach((q, index) => {
        container.innerHTML += `<button type="button" class="tab-trigger-btn" id="tab-trigger-${index}" onclick="activateTab(${index})">Task ${index + 1} <span style="font-size:0.7rem; background:#E5E7EB; padding:1px 3px; border-radius:2px;">${q.points}pt</span></button>`;
    });
}

function generatePanels() {
    const container = document.getElementById('exam-panels-container');
    if (!container) return;
    container.innerHTML = '';
    
    examQuestions.forEach((q, index) => {
        const panel = document.createElement('div');
        panel.className = 'exam-task-panel';
        panel.id = `task-panel-${index}`;
        
        panel.innerHTML = `
            <div style="font-size:0.75rem; color:#6B7280; font-weight:600; margin-bottom:0.25rem; text-transform: uppercase;">CHAPTER ${q.chapter} Focus</div>
            <div style="font-weight:600; margin-bottom:0.75rem; color:#111827;">${q.instruction}</div>
            <div class="task-interactive-body">${q.content}</div>
            
            <div class="feedback-box hidden" id="feedback-panel-${index}" style="display: none; margin-top: 1rem; padding: 1rem; border-radius: 6px;">
                <div id="feedback-title-${index}" style="font-weight:700; margin-bottom:0.5rem;"></div>
                <div style="font-size:0.85rem; color:#4B5563; padding-top:0.5rem; border-top:1px dashed rgba(0,0,0,0.15);">
                    <strong>Solution Note:</strong> ${q.explanation}
                </div>
            </div>
        `;
        container.appendChild(panel);
    });
}

function activateTab(index) {
    if (index < 0 || index >= examQuestions.length) return;
    document.querySelectorAll('.tab-trigger-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.exam-task-panel').forEach(p => {
        p.classList.remove('active');
        p.style.display = 'none';
    });
    
    document.getElementById(`tab-trigger-${index}`).classList.add('active');
    const activePanel = document.getElementById(`task-panel-${index}`);
    activePanel.classList.add('active');
    activePanel.style.display = 'block';
    
    currentTabActive = index;
    document.getElementById('btn-prev').disabled = (index === 0);
    document.getElementById('btn-next').disabled = (index === examQuestions.length - 1);
}

function navPrev() { if (currentTabActive > 0) activateTab(currentTabActive - 1); }
function navNext() { if (currentTabActive < examQuestions.length - 1) activateTab(currentTabActive + 1); }

function submitExam() {
    if (isExamSubmitted) return;
    clearInterval(examTimerInterval);
    isExamSubmitted = true;
    let available = 0, awarded = 0;

    examQuestions.forEach((q, index) => {
        const panel = document.getElementById(`task-panel-${index}`);
        const feedbackBox = document.getElementById(`feedback-panel-${index}`);
        const feedbackTitle = document.getElementById(`feedback-title-${index}`);
        available += q.points;
        let isCorrect = true;

        if (q.type === "radio") {
            const sel = panel.querySelector(`input[name="q${q.id}"]:checked`);
            isCorrect = (sel && sel.value === q.correct);
        } else {
            panel.querySelectorAll('input[data-ans]').forEach(i => {
                if (i.value.trim().toLowerCase() !== i.getAttribute('data-ans').trim().toLowerCase()) {
                    isCorrect = false;
                    i.style.borderColor = "#DC2626";
                } else {
                    i.style.borderColor = "#059669";
                }
                i.disabled = true;
            });
        }

        feedbackBox.style.display = 'block';
        feedbackBox.classList.remove('hidden');
        
        if (isCorrect) {
            awarded += q.points;
            feedbackBox.style.backgroundColor = "#DEF7EC";
            feedbackBox.style.borderLeft = "4px solid #059669";
            feedbackTitle.innerHTML = `✅ Correct! (+${q.points} Pts)`;
            feedbackTitle.style.color = "#065F46";
        } else {
            feedbackBox.style.backgroundColor = "#FDE8E8";
            feedbackBox.style.borderLeft = "4px solid #DC2626";
            feedbackTitle.innerHTML = `❌ Incorrect! (0 / ${q.points} Pts)`;
            feedbackTitle.style.color = "#9B1C1C";
        }
    });

    const score = available > 0 ? Math.round((awarded / available) * 100) : 0;
    document.getElementById('res-score').textContent = `${score}%`;
    document.getElementById('res-points').textContent = `${awarded} / ${available}`;
    
    const outcomeField = document.getElementById('res-outcome');
    if (score >= 70) {
        outcomeField.textContent = "PASS (Competent)";
        outcomeField.style.color = "#059669";
    } else {
        outcomeField.textContent = "FAIL (Not Yet Competent)";
        outcomeField.style.color = "#DC2626";
    }

    document.querySelectorAll('.feedback-box').forEach(fb => {
        fb.style.display = 'block';
        fb.classList.remove('hidden');
    });

    document.getElementById('results-card').classList.remove('hidden');
    alert(`Assessment submitted! Your score is ${score}%`);
}

function resetExam() {
    if (confirm("Reset current exam session? All inputs will be wiped.")) {
        clearInterval(examTimerInterval);
        isExamSubmitted = false;
        timeRemainingSeconds = 3600;
        document.getElementById('exam-timer').style.color = "#FFFFFF";
        document.getElementById('results-card').classList.add('hidden');
        initExamEngine();
    }
}

function startExamTimer() {
    const display = document.getElementById('exam-timer');
    examTimerInterval = setInterval(() => {
        if (timeRemainingSeconds <= 0) {
            clearInterval(examTimerInterval);
            submitExam();
        } else {
            timeRemainingSeconds--;
            let min = Math.floor(timeRemainingSeconds / 60), sec = timeRemainingSeconds % 60;
            display.textContent = `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
            if (timeRemainingSeconds < 300) display.style.color = "#DC2626";
        }
    }, 1000);
}

function toggleCalc() {
    const c = document.getElementById('neon-calc');
    c.style.display = (c.style.display === 'block') ? 'none' : 'block';
}
function pressNum(n) {
    const d = document.getElementById('calc-display');
    d.value = (d.value === '0') ? n : d.value + n;
}
function pressOp(o) { document.getElementById('calc-display').value += o; }
function clearCalc() { document.getElementById('calc-display').value = '0'; }
function calcResult() {
    const d = document.getElementById('calc-display');
    try { d.value = eval(d.value); } catch(e) { d.value = 'Error'; }
}
</script>
