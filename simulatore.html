function updateChapters(){

    const levelSelect =
        document.getElementById("level-select");

    const chapterSelect =
        document.getElementById("chapter-select");

    const selectedLevel =
        levelSelect.value;

    chapterSelect.innerHTML = "";

    if(!selectedLevel){

        chapterSelect.innerHTML =
        '<option value="">Select a level first...</option>';

        chapterSelect.disabled = true;
        return;
    }

    chapterSelect.disabled = false;

    const chapters =
        syllabusData[selectedLevel] || [];

    const defaultOption =
        document.createElement("option");

    defaultOption.value = "";
    defaultOption.textContent =
        "Select a chapter...";

    chapterSelect.appendChild(defaultOption);

    chapters.forEach(ch => {

        const option =
            document.createElement("option");

        option.value = ch.value;
        option.textContent = ch.label;

        chapterSelect.appendChild(option);
    });
}

function rand(min,max){

    return Math.floor(
        Math.random()*(max-min+1)
    ) + min;
}

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j =
        Math.floor(Math.random()*(i+1));

        [array[i],array[j]] =
        [array[j],array[i]];
    }

    return array;
}

function currency(v){

    return "£" +
    Number(v).toFixed(2);
}
function pick(arr){
    return arr[rand(0, arr.length - 1)];
}

    return {

function createExamQuestions(){

    const level =
        document.getElementById(
            "level-select"
        ).value;

    const chapter =
        document.getElementById(
            "chapter-select"
        ).value;

    const pool =
        buildQuestionPool();

    let generators = [];

    if(level === "random"){

        generators =
        Object.values(pool);
    }
        else if(
        chapter &&
        !chapter.includes("random")
    ){

        generators = [
            pool[chapter]
        ];
    }

    else{

        generators =
        Object.entries(pool)
        .filter(([key]) =>
            key.startsWith(level)
        )
        .map(([,fn]) => fn);
    }

    const questions = [];

    for(let i=0;i<15;i++){

        const generator =
            generators[
                rand(
                    0,
                    generators.length-1
                )
            ];

        questions.push(generator());
    }

    return questions;
}

    const chosen =
    Number(selected.value);

    const correct =

    const marker =

    document.getElementById(
        "marker-" + chosen

    marker.textContent =

    chosen === correct

    ? "✔"

    : "❌";

    marker.style.color =

    chosen === correct

    ? "#16A34A"

    : "#DC2626";
}
