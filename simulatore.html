function updateChapters(){

    const levelSelect =
        document.getElementById("level-select");

    const chapterSelect =
        document.getElementById("chapter-select");

    const selectedLevel =
        levelSelect.value;

    chapterSelect.innerHTML = "";

    if(!selectedLevel){

        chapterSelect.innerHTML =
        '<option value="">Select a level first...</option>';

        chapterSelect.disabled = true;
        return;
    }

    chapterSelect.disabled = false;

    const chapters =
        syllabusData[selectedLevel] || [];

    const defaultOption =
        document.createElement("option");

    defaultOption.value = "";
    defaultOption.textContent =
        "Select a chapter...";

    chapterSelect.appendChild(defaultOption);

    chapters.forEach(ch => {

        const option =
            document.createElement("option");

        option.value = ch.value;
        option.textContent = ch.label;

        chapterSelect.appendChild(option);
    });
}

function safeGetGenerator(pool, chapter){

    const gen = pool[chapter];

    if(typeof gen !== "function"){
        throw new Error("Missing generator for " + chapter);
    }

    return gen;
}
function createExamQuestions(){

    const level =
        document.getElementById("level-select").value;

    const chapter =
        document.getElementById("chapter-select").value;

    const pool = buildQuestionPool();

    let generators = [];

    if(level === "random"){

        generators =
        Object.values(pool)
        .filter(fn => typeof fn === "function");
    }

    else if(chapter && !chapter.includes("random")){

        const generator =
            safeGetGenerator(pool, chapter);

        const questions = [];

}
    else if(level){

        generators =
        Object.entries(pool)
        .filter(([key]) => key.startsWith(level))
        .map(([,fn]) => fn);
    }

    if(generators.length === 0){
        throw new Error(
            "No question generators available for selection"
        );
    }

    const questions = [];

    for(let i=0;i<15;i++){

        const generator =
            generators[
                rand(0,generators.length-1)
            ];

        questions.push(
            generator()
        );
    }

    return questions;
}

){

    let html =

    'border-collapse:collapse;' +
    'border:1px solid #000;' +

    html += '<tr>';

        'padding:6px;' +

function checkAnswer(){

  const q =
questions[currentQuestion];

console.log("CHECK", q);

if(
    q.taskType === "invoice" ||
q.taskType === "purchaseInvoice" ||
q.taskType === "deliveryInvoice" ||
q.taskType === "creditNote"
){

    console.log("INVOICE MODE");

        const netText =
document.getElementById(
    "net-answer"
).value.trim();

const vatText =
document.getElementById(
    "vat-answer"
).value.trim();

const grossText =
document.getElementById(
    "gross-answer"
).value.trim();

if(
    netText.includes(",") ||
    vatText.includes(",") ||
    grossText.includes(",")
){
    alert(
        "Use a decimal point (.) not a comma (,)."
    );
    return;
}

const net = Number(netText);
const vat = Number(vatText);
const gross = Number(grossText);

        const checks = [

            {
                user: net,
                correct: q.answers.net,
                marker: "net-marker"
            },

            {
                user: vat,
                correct: q.answers.vat,
                marker: "vat-marker"
            },

            {
                user: gross,
                correct: q.answers.gross,
                marker: "gross-marker"
            }
        ];

        checks.forEach(item=>{

            const marker =
            document.getElementById(
                item.marker
            );

            const ok =
            Math.abs(
                item.user -
                item.correct
            ) < 0.01;

            marker.textContent =
            ok ? "✔" : "✖";

            marker.style.color =
            ok ? "#16A34A" : "#DC2626";

            marker.style.fontWeight =
            "700";
        });

        return;
    }

    if(q.taskType === "reversalError"){

    const answer =
    document.getElementById("reversal-answer").value;

    const marker =
    document.getElementById("reversal-marker");

    const correct = answer === q.answer;

    marker.textContent = correct ? "✔" : "✖";
    marker.style.color = correct ? "#16A34A" : "#DC2626";

    return;
}

if(q.taskType === "transpositionError"){

    const answer =
    document.getElementById("transposition-answer").value;

    const marker =
    document.getElementById("transposition-marker");

    const correct = answer === q.answer;

    marker.textContent = correct ? "✔" : "✖";
    marker.style.color = correct ? "#16A34A" : "#DC2626";

    return;
}

if(q.taskType === "controlCorrection"){

    const answer =
    parseFloat(document.getElementById("control-answer").value);

    const marker =
    document.getElementById("control-marker");

    const correct = answer === q.answer;

    marker.textContent = correct ? "✔" : "✖";
    marker.style.color = correct ? "#16A34A" : "#DC2626";

    return;
}

if(q.taskType === "multiErrorCase"){

    const answer =
    document.getElementById("multi-error-answer").value;

    const marker =

/* CALCOLATRICE */

const calcWidget = document.getElementById("calc-widget");
const calcTrigger = document.getElementById("calc-toggle-trigger");
const calcClose = document.getElementById("calc-close-btn");
const calcDisplay = document.getElementById("calc-screen");

calcTrigger.onclick = () => {
    calcWidget.style.display = "block";
};

calcClose.onclick = () => {
    calcWidget.style.display = "none";
};

function pressCalc(val){
    if(calcDisplay.innerText === "0" && !isNaN(val)){
        calcDisplay.innerText = "";
    }

    if(val === "sq"){
        calcDisplay.innerText =
            Math.pow(eval(calcDisplay.innerText),2);
    }
    else if(val === "rt"){
        calcDisplay.innerText =
            Math.sqrt(eval(calcDisplay.innerText));
    }
    else{
        calcDisplay.innerText += val;
    }
}

function clearCalc(){
    calcDisplay.innerText = "0";
}

function calculateCalc(){
    try{
        calcDisplay.innerText =
            eval(calcDisplay.innerText);
    }
    catch(e){
        calcDisplay.innerText = "Error";
    }
}
