function updateChapters(){

    const levelSelect =
        document.getElementById("level-select");

    const chapterSelect =
        document.getElementById("chapter-select");

    const selectedLevel =
        levelSelect.value;

    chapterSelect.innerHTML = "";

    if(!selectedLevel){

        chapterSelect.innerHTML =
        '<option value="">Select a level first...</option>';

        chapterSelect.disabled = true;
        return;
    }

    chapterSelect.disabled = false;

    const chapters =
        syllabusData[selectedLevel] || [];

    const defaultOption =
        document.createElement("option");

    defaultOption.value = "";
    defaultOption.textContent =
        "Select a chapter...";

    chapterSelect.appendChild(defaultOption);

    chapters.forEach(ch => {

        const option =
            document.createElement("option");

        option.value = ch.value;
        option.textContent = ch.label;

        chapterSelect.appendChild(option);
    });
}

function safeGetGenerator(pool, chapter){

    const gen = pool[chapter];

    if(typeof gen !== "function"){
        throw new Error("Missing generator for " + chapter);
    }

    return gen;
}
function createExamQuestions(){

    const level =
        document.getElementById("level-select").value;

    const chapter =
        document.getElementById("chapter-select").value;

    const pool = buildQuestionPool();

    let generators = [];

    if(level === "random"){

        generators =
        Object.values(pool)
        .filter(fn => typeof fn === "function");
    }

    else if(chapter && !chapter.includes("random")){

        const generator =
            safeGetGenerator(pool, chapter);

        const questions = [];

        for(let type=1; type<=15; type++){

    questions.push(
        generator(type)
    );
}

console.log(questions);

return shuffle(questions);
}
    else if(level){

        generators =
        Object.entries(pool)
        .filter(([key]) => key.startsWith(level))
        .map(([,fn]) => fn);
    }

    if(generators.length === 0){
        throw new Error(
            "No question generators available for selection"
        );
    }

    const questions = [];

    for(let i=0;i<15;i++){

        const generator =
            generators[
                rand(0,generators.length-1)
            ];

        questions.push(
            generator()
        );
    }

    return questions;
}
